name: Daily Engoo News

on:
  schedule:
    # Every day at 05:00 UTC ≈ 07:00 / 08:00 Israel time (winter/summer)
    - cron: "0 5 * * *"
  workflow_dispatch:  # allows manual run from GitHub UI

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 3 new articles per topic
        run: python scripts/fetch_daily.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "engoo-daily-bot"
          git config user.email "engoo-daily-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new articles today."
          else
            git commit -m "Daily Engoo news: $(date -u +%Y-%m-%d)"
            git push
          fi
